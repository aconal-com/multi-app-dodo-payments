version: '3.8'

services:
  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dodo-payments-service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - SERVICE_PORT=8001
      - LOG_LEVEL=INFO
      
      # Dodo Payments (set these in .env file)
      - DODO_API_KEY=${DODO_API_KEY}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET}
      - DODO_BASE_URL=${DODO_BASE_URL:-https://api.dodopayments.com}
      
      # Database
      - MYSQL_HOST=payment-db
      - MYSQL_USER=payment_user
      - MYSQL_PASSWORD=payment_password_123
      - MYSQL_DATABASE=dodo_payments_db
      - MYSQL_PORT=3306
      
      # Security
      - API_KEY_ENCRYPTION_KEY=your_encryption_key_min_32_chars_long
      - WEBHOOK_SIGNING_SECRET=your_webhook_signing_secret_key
      - ENABLE_IP_WHITELIST=false
      
      # Features
      - ENABLE_REFUNDS=true
      - ENABLE_SUBSCRIPTIONS=true
      - ENABLE_ANALYTICS=true
      
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - payment-db
    networks:
      - payment-network
    restart: unless-stopped

  # MySQL Database
  payment-db:
    image: mysql:8.0
    container_name: dodo-payments-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_123
      - MYSQL_DATABASE=dodo_payments_db
      - MYSQL_USER=payment_user
      - MYSQL_PASSWORD=payment_password_123
    ports:
      - "3307:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
      - ./payments-db-structure.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  payment-network:
    driver: bridge

volumes:
  payment-db-data:

